# cargo-deny (CI): licenses compatible with GPL-3.0-or-later (same list as
# about.toml), crates only from crates.io, known vulnerabilities.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
# Unmaintained crates are reported only when the workspace uses them directly:
# the others come with Tauri or zbus and are replaced by upgrading those.
unmaintained = "workspace"
