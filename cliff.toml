# git-cliff: CHANGELOG.md and release notes from the Conventional Commits
# (scripts/release.sh, release workflow). Only what users notice is listed:
# features, fixes and performance; docs, CI, tests and chores are left out.
# The first release (no version before it) gets a written summary instead
# of its whole development history.

[changelog]
header = """
# Changelog

Notable changes of Padboard, generated from the commit history with
[git-cliff](https://git-cliff.org). Versions follow [Semantic Versioning](https://semver.org).

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% if version and not previous.version %}
Initial release.

- **Desktop app** (Windows 10/11, Linux): an editor for the tablet's \
buttons, with pages, folders, profiles, drag and drop, undo and redo, \
Lucide icons and colors. It lives in the notification area and can start \
with the session.
- **Actions**: keyboard shortcuts, media controls, volume and sound output \
mute, microphone mute, opening an app, a file or a website, locking the \
session, multi actions, page and folder navigation, and OBS Studio (scenes, \
recording, streaming, audio inputs). Buttons show live states: microphone \
muted, active scene, REC, LIVE.
- **Tablet app** (Android 8+): the button grid with page swipes and folders, \
over USB (no setup) or Wi-Fi (TLS, PIN pairing with a key fingerprint \
check), automatic reconnection and USB/Wi-Fi switch, kiosk mode for a \
dedicated tablet, screensaver with a clock.
- English and French.
{% else %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\
{% endif %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
# Release candidates fold into the release that follows them.
ignore_tags = "-rc\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = ".*", skip = true },
]
