# git-cliff: CHANGELOG.md and release notes from the Conventional Commits
# (scripts/release.sh, release workflow). Only what users notice is listed:
# features, fixes and performance; docs, CI, tests and chores are left out.
# The first release (no version before it) gets a written summary instead
# of its whole development history. The releases that follow 0.1.0 (which
# has no updater) say how to install them by hand.

[changelog]
header = """
# Changelog

Notable changes of Padboard, generated from the commit history with
[git-cliff](https://git-cliff.org). Versions follow [Semantic Versioning](https://semver.org).

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% if version and not previous.version %}
Initial release.

- **Desktop app** (Windows 10/11, Linux): an editor for the tablet's \
buttons, with pages, folders, profiles, drag and drop, undo and redo, \
Lucide icons and colors. It lives in the notification area and can start \
with the session.
- **Actions**: keyboard shortcuts, media controls, volume and sound output \
mute, microphone mute, opening an app, a file or a website, locking the \
session, multi actions, page and folder navigation, and OBS Studio (scenes, \
recording, streaming, audio inputs). Buttons show live states: microphone \
muted, active scene, REC, LIVE.
- **Tablet app** (Android 8+): the button grid with page swipes and folders, \
over USB (no setup) or Wi-Fi (TLS, PIN pairing with a key fingerprint \
check), automatic reconnection and USB/Wi-Fi switch, kiosk mode for a \
dedicated tablet, screensaver with a clock.
- English and French.
{% else %}\
{% if previous.version == "v0.1.0" %}
### Upgrading from 0.1.0

0.1.0 cannot update itself: install this version by hand once. On Windows, run the new installer over the old version (your configuration is kept); on Linux, `sudo apt install ./Padboard_<version>_amd64.deb`. Then plug the tablet in over USB and click **Update** next to it in the PC's connections view (USB devices card). From then on, the PC looks for new versions by itself and updates the tablet.
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\
{% endif %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
# Release candidates fold into the release that follows them.
ignore_tags = "-rc\\.[0-9]+$"
sort_commits = "oldest"
# 0.2.0: fixes to features that 0.1.0 did not have (Wi-Fi and USB tablet
# updates, the Windows updater, Installer adb), and test or development
# entries, are left out: nobody upgrading from 0.1.0 met those bugs. A few
# messages are reworded for what the release really does.
commit_preprocessors = [
    { pattern = "^feat\\(desktop\\): look for new versions and install them on Windows", replace = "feat(desktop): look for new versions; on Windows, download the installer, check it and show it" },
    { pattern = "^feat\\(desktop\\): open the update wizard and say when an update did not install", replace = "feat(desktop): say when an update did not install" },
    { pattern = "^fix\\(kiosk\\): move the exit gesture to an empty corner, clearer confirmation", replace = "fix(kiosk): the exit gesture moves to the bottom-left corner, with a clearer confirmation" },
]
commit_parsers = [
    { sha = "3a01ffe88e0f051c0d5832c342a0b8426780030f", skip = true },
    { sha = "51a8f5d28c5d55c3d4aebec099fc4bd54924e5a4", skip = true },
    { sha = "a8c65e639a08c0e1c3fb3e00b08d1d54d6081757", skip = true },
    { sha = "73405a03e9c8c50c28d456e6df39e963017327c4", skip = true },
    { sha = "ef1b70665a4103e5450a920faecf779a108a9017", skip = true },
    { sha = "6b6947174bbe58b4bec832956aa6faf68dbe320d", skip = true },
    { sha = "11f28f1adc84c1601db58cafc0e4bd0a4319fdeb", skip = true },
    { sha = "fbf6e806ddab0b3ded7154e54723b52d2b2b6983", skip = true },
    { sha = "f226bbcfd3999da4cd7e308ad01c69bf3c4038ef", skip = true },
    { sha = "5776cc10247b862aed28c8d363a5ac5685b6a042", skip = true },
    { sha = "bf7a2915f50585266b1ef03d10b455b976691a68", skip = true },
    { sha = "da24858fda145dab919d6d95c8905dc2ac3cd0fb", skip = true },
    { sha = "152794a795c06780260cb62b2273812d44b036ad", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = ".*", skip = true },
]
