[package]
name = "padboard-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
typeshare.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
# PulseAudio native protocol in pure Rust (PipeWire serves it through
# pipewire-pulse): no libpulse needed to build or run.
pulseaudio = "0.3.2"
# MPRIS media players over the session bus. 5.x: 6.x needs Rust 1.89.
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_Shutdown",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
