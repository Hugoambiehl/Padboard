# cargo-about: licenses of the Rust crates built into the desktop app
# (scripts/licenses.sh). Every license must be listed here and be compatible
# with GPL-3.0-or-later; cargo-deny checks the same list (deny.toml).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
