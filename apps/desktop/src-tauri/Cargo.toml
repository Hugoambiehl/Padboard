[package]
name = "padboard-desktop"
description = "Padboard desktop app: WebSocket server, action execution and editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "padboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
padboard-protocol.workspace = true
padboard-actions.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tauri = { version = "~2.11", features = [] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
if-addrs = "0.15.0"
gethostname = "1.1.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
