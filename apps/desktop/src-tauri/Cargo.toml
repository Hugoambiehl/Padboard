[package]
name = "padboard-desktop"
description = "Padboard desktop app: WebSocket server, action execution and editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "padboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
padboard-protocol.workspace = true
padboard-actions.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
typeshare.workspace = true
base64 = "0.23.1"
# Update signatures (minisign, the same as tauri-plugin-updater).
minisign-verify = "0.2.5"
semver = "1.0.28"
# Release lookups and downloads (GitHub), with our rustls (ring).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy", "stream"] }
getrandom = "0.4.3"
mdns-sd = "0.21.7"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
sha2.workspace = true
subtle = "2.6.1"
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
# Start with the session (entry written with a quoted path, see autostart.rs).
auto-launch = "0.6.0"
tauri-plugin-single-instance = "~2.4"
tauri-plugin-dialog = "~2.7"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
if-addrs = "0.15.0"
gethostname = "1.1.0"
sys-locale = "0.3.2"
uuid = { version = "1.26.1", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Is a tray host running (StatusNotifierWatcher)? Same zbus as padboard-actions.
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
# Dark tray menu (uxtheme's SetPreferredAppMode, see tray.rs).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
# In-app updates (NSIS). Not on Linux: the .deb is updated by hand. 2.12 is
# the last one for tauri 2.11 (and Rust 1.88); needs `requireSignedVersion`.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tempfile = "3.27.0"
# stdin for the fake-tablet example
tokio = { version = "1.54.1", features = ["io-std"] }

[lints]
workspace = true
