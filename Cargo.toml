[workspace]
resolver = "3"
members = ["crates/*"]
# apps/desktop/src-tauri is added once the Tauri app exists (phase 1, step E).

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
padboard-protocol = { path = "crates/protocol" }
padboard-actions = { path = "crates/actions" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
