[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"
authors = ["Padboard contributors"]
repository = "https://github.com/Hugoambiehl/Padboard"

[workspace.dependencies]
padboard-protocol = { path = "crates/protocol" }
padboard-actions = { path = "crates/actions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
typeshare = "1.0.5"
thiserror = "2.0.21"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Smaller dev builds (target/ reached 60 GB): line tables only for our code
# (backtraces keep file and line), no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
