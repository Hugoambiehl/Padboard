name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security issues go through a private report instead:
        see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a button with the action …
        2. Press it on the tablet
        3. …
  - type: input
    id: desktop-version
    attributes:
      label: Desktop app version
      description: Connections → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: PC operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu)
        - Linux (Debian)
        - Linux (other)
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS details
      description: Version, and on Linux the desktop (GNOME, KDE…) and X11 or Wayland.
  - type: input
    id: tablet
    attributes:
      label: Tablet
      description: Model, Android version, Padboard version (About and licenses).
      placeholder: "Galaxy Tab A 10.1, Android 12, 0.1.0"
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Wi-Fi
        - Both
        - Not relevant
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The relevant part of padboard.log (Windows: %APPDATA%\io.github.hugoambiehl.padboard\,
        Linux: ~/.config/io.github.hugoambiehl.padboard/). Check it for anything private first.
      render: text
