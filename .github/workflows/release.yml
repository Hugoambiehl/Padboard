# Release builds (see docs/releasing.md).
#
# A tag v* (pushed by `git push origin main vX` after scripts/release.sh)
# builds the Windows installer (NSIS, unsigned), the Linux .deb and the
# unsigned release APK, then creates a DRAFT GitHub release with them, the
# SHA-256 sums and the CHANGELOG.md section of the version (pre-release for
# -rc.N). The maintainer then signs the draft on their PC
# (scripts/sign-release.sh: APK, update signatures, latest.json, signed
# SHA256SUMS): the signing keys never leave it.
#
# Manual run (`gh workflow run Release --ref main`): the same builds, kept as
# artifacts for 7 days, no release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: 24
  # Must match CARGO_ABOUT_VERSION in scripts/licenses.sh (same cache as the CI).
  CARGO_ABOUT_VERSION: 0.9.3
  CARGO_DENY_VERSION: 0.20.2

jobs:
  notices:
    name: Version check and third-party notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # A tag must match the version written by scripts/release.sh.
      - name: Version
        id: version
        run: |
          version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The app checks its updates with this key: a release without it
      # could never update itself (docs/release-signing.md).
      - name: Update public key
        if: github.ref_type == 'tag'
        run: |
          if [[ ! -s apps/desktop/src-tauri/updater-key.pub ]]; then
            echo "::error::apps/desktop/src-tauri/updater-key.pub is empty"
            exit 1
          fi

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo-about and cargo-deny
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/cargo-deny
          key: license-tools-${{ runner.os }}-${{ env.CARGO_ABOUT_VERSION }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-about and cargo-deny
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --features cli --locked
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Third-party notices
        run: |
          npm ci --prefix apps/desktop
          scripts/licenses.sh

      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: apps/desktop/src/generated/licenses.json
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: notices
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: apps/desktop/src/generated

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Unsigned for now: SmartScreen warns on first launch (docs/install-windows.md); SignPath once public.
      - name: Build the installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis

      # Test builds can read releases from a local server (test-updates
      # feature, updates/source.rs): a shipped binary must not contain it.
      - name: No test update source in the binary
        shell: bash
        run: |
          if grep -q PADBOARD_TEST_RELEASES target/release/padboard-desktop.exe; then
            echo "::error::the installer's app was built with test-updates"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux package
    needs: notices
    # The oldest supported runner: the .deb then installs on Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: apps/desktop/src/generated

      # appindicator: the tray; the bundler finds it and adds the package's
      # runtime dependency to the .deb.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config file \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build the .deb
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles deb

      - name: No test update source in the binary
        run: |
          if grep -q PADBOARD_TEST_RELEASES target/release/padboard-desktop; then
            echo "::error::the .deb's app was built with test-updates"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android APK (unsigned)
    needs: notices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # No signing key in CI: the APK is signed on the maintainer's PC.
      - name: Release APK
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
            "padboard-${{ needs.notices.outputs.version }}-unsigned.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: apps/android/padboard-*-unsigned.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [notices, windows, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{windows,linux,android}"
          merge-multiple: true

      - name: Release notes (the version's CHANGELOG.md section)
        env:
          VERSION: ${{ needs.notices.outputs.version }}
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::no section for $VERSION in CHANGELOG.md"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ---
          Install: [Windows](https://github.com/Hugoambiehl/Padboard/blob/main/docs/install-windows.md),
          [Linux](https://github.com/Hugoambiehl/Padboard/blob/main/docs/install-linux.md),
          [tablet](https://github.com/Hugoambiehl/Padboard/blob/main/docs/install-tablet.md).
          The Windows installer is not signed yet: SmartScreen asks for confirmation on
          first launch. Check the downloads against `SHA256SUMS`.
          EOF

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notices.outputs.version }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cd ..
          prerelease=()
          [[ "$VERSION" == *-rc.* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft "${prerelease[@]}" \
            --title "Padboard $VERSION" \
            --notes-file notes.md \
            --verify-tag
