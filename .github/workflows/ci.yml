# Continuous integration.
#
# Private repo: Windows minutes count double, so the Windows job only runs on
# pushes to main, on pull requests and on manual runs. Everything else runs on
# every push. A newer run on the same ref cancels the previous one. The Windows
# installer is only built on demand: `gh workflow run CI -f installer=true`.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: Also build the Windows installer (unsigned, for tests)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Must match TYPESHARE_VERSION in scripts/gen-types.sh.
  TYPESHARE_VERSION: 1.13.4
  NODE_VERSION: 24

jobs:
  linux:
    name: Rust + desktop frontend (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # No debug info: faster builds and links, smaller cache. Not needed in CI.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend - install
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend - lint, format and unit tests
        working-directory: apps/desktop
        run: |
          npm run lint
          npm run format:check
          npm test

      # The end-to-end tests only run locally (scripts/desktop-e2e.sh), but
      # their code is type-checked here so it does not rot.
      - name: Frontend - type-check the end-to-end tests
        working-directory: apps/desktop
        run: npx tsc --noEmit -p tsconfig.e2e.json

      # Type-checks (vue-tsc) and produces dist/, which the Tauri crate embeds.
      - name: Frontend - build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Test builds only (local release server, updates/source.rs).
      - name: cargo clippy (test-updates)
        run: cargo clippy -p padboard-desktop --all-targets --features test-updates --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_<version>_checksums.txt (linux_x64).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # The whole history is scanned, not only the pushed commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Exceptions (fake test values) live in .gitleaks.toml.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner .'

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Must match CARGO_ABOUT_VERSION in scripts/licenses.sh.
      CARGO_ABOUT_VERSION: 0.9.3
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo-about and cargo-deny
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/cargo-deny
          key: license-tools-${{ runner.os }}-${{ env.CARGO_ABOUT_VERSION }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-about and cargo-deny
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --features cli --locked
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      # Licenses (deny.toml), crates.io only, RustSec advisories.
      - name: cargo deny
        run: cargo deny --locked check

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The notices shown by the desktop app: every crate and npm package must
      # have an accepted license (about.toml, scripts/licenses.mjs).
      - name: Third-party notices
        run: |
          npm ci --prefix apps/desktop
          scripts/licenses.sh

  types:
    name: Generated protocol types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache typeshare-cli
        id: typeshare-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-${{ runner.os }}-${{ env.TYPESHARE_VERSION }}

      - name: Install typeshare-cli
        if: steps.typeshare-cache.outputs.cache-hit != 'true'
        run: cargo install typeshare-cli --version "$TYPESHARE_VERSION" --locked

      - name: Check generated TS and Kotlin types are up to date
        run: scripts/gen-types.sh --check

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # "basic" = the MIT provider built on actions/cache (the default one is
      # proprietary, see CLAUDE.md).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runner image ships the Android SDK (ANDROID_HOME) with accepted
      # licenses; AGP downloads a missing platform if needed.
      - name: ktlint, unit tests, Android Lint, debug APK
        run: ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: apps/android/app/build/reports/
          retention-days: 7

  windows:
    name: Rust (Windows)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      # No debug info: faster builds and links, smaller cache. Not needed in CI.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # dist/ is embedded by the Tauri crate; lint and format already ran on Linux.
      - name: Frontend - build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  windows-installer:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' && inputs.installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: installer

      # Release build with the frontend embedded; NSIS only (one installer).
      # Unsigned: Windows SmartScreen warns on first launch (signing: phase 6).
      - name: Build the installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: padboard-windows-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
